name: Dump v111 RCON source

on:
  push:
    branches: [hapych-admin-app]

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and dump
        shell: bash
        run: |
          cat hapych-admin-overrides-v106-chunks/MainActivity.part*.b64 | base64 -d | gzip -d > /tmp/MainActivity.kt
          cat hapych-admin-v111/RconClient.part*.b64 | base64 -d | gzip -d > /tmp/RconClient.kt
          echo '--- RCON parse ---'
          grep -n -A220 -B40 'private fun parsePayload' /tmp/RconClient.kt || true
          echo '--- MainActivity home ---'
          cat hapych-admin-overrides-v106-chunks/MainActivity.part*.b64 | base64 -d | gzip -d > /tmp/MainActivity.kt
          grep -n -A260 -B40 'fun HomeScreen' /tmp/MainActivity.kt || grep -n -A260 -B40 'ScreenHeader("HAPYCH Admin"' /tmp/MainActivity.kt || true
