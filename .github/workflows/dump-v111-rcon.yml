name: Dump v111 RCON source

on:
  push:
    branches: [hapych-admin-app]

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and dump
        shell: bash
        run: |
          cat hapych-admin-overrides-v106-chunks/MainActivity.part*.b64 | base64 -d | gzip -d > /tmp/MainActivity.kt
          cat hapych-admin-v111/RconClient.part*.b64 | base64 -d | gzip -d > /tmp/RconClient.kt
          grep -n -A80 -B25 'fun sendCommand' /tmp/RconClient.kt || true
          echo '--- write websocket ---'
          grep -n -A80 -B25 'writeWebSocketText' /tmp/RconClient.kt || true
