name: Build HAPYCH Admin APK

on:
  push:
    branches: [hapych-admin-app]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Restore HAPYCH Admin source
        shell: bash
        run: |
          cat hapych-admin-b64/part-* | tr -d '\n' | base64 -d > HAPYCH-Admin-source.zip
          mkdir -p hapych-admin
          unzip -q HAPYCH-Admin-source.zip -d hapych-admin
          sed -i '/import androidx.compose.foundation.layout.Column/a import androidx.compose.foundation.layout.ColumnScope' hapych-admin/app/src/main/java/com/hapych/admin/MainActivity.kt
          sed -i 's/content: @Composable Column\.() -> Unit/content: @Composable ColumnScope.() -> Unit/' hapych-admin/app/src/main/java/com/hapych/admin/MainActivity.kt

          # Replace the original WebRCON-only client with AUTO WebRCON + Legacy Source RCON transport.
          cat hapych-admin-overrides/RconClient.part0.b64 hapych-admin-overrides/RconClient.part1.b64 | base64 -d | gzip -d > hapych-admin/app/src/main/java/com/hapych/admin/RconClient.kt

          # HAPYCH identity/version.
          sed -i 's/applicationId = "com.hapych.admin"/applicationId = "ru.hapychrust.admin"/' hapych-admin/app/build.gradle.kts
          sed -i 's/android:name=".MainActivity"/android:name="com.hapych.admin.MainActivity"/' hapych-admin/app/src/main/AndroidManifest.xml
          sed -i 's/versionCode = 1/versionCode = 4/' hapych-admin/app/build.gradle.kts
          sed -i 's/versionName = "1.0.0"/versionName = "1.0.4"/' hapych-admin/app/build.gradle.kts

          # UI text for automatic protocol detection.
          sed -i 's/Rust WebRCON • live/Rust RCON • AUTO/' hapych-admin/app/src/main/java/com/hapych/admin/MainActivity.kt
          sed -i 's/RUST WEBRCON/RUST RCON • AUTO/' hapych-admin/app/src/main/java/com/hapych/admin/MainActivity.kt
          sed -i 's/Подключено к Rust WebRCON/Подключено к Rust RCON/' hapych-admin/app/src/main/java/com/hapych/admin/MainActivity.kt
          sed -i 's/Включай, только если RCON проксируется через TLS/Для обычного Alkad RCON оставь выключенным/' hapych-admin/app/src/main/java/com/hapych/admin/MainActivity.kt

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: hapych-admin
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK signature and manifest
        shell: bash
        run: |
          APK="hapych-admin/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -20
          cp "$APK" HAPYCH-Admin-v1.0.4-RCON-AUTO.apk
          sha256sum HAPYCH-Admin-v1.0.4-RCON-AUTO.apk > HAPYCH-Admin-v1.0.4-RCON-AUTO.apk.sha256

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: HAPYCH-Admin-v1.0.4-RCON-AUTO
          path: |
            HAPYCH-Admin-v1.0.4-RCON-AUTO.apk
            HAPYCH-Admin-v1.0.4-RCON-AUTO.apk.sha256
          if-no-files-found: error
