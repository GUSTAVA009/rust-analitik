name: Build HAPYCH Admin APK

on:
  push:
    branches: [hapych-admin-app]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Restore HAPYCH Admin source
        shell: bash
        run: |
          cat hapych-admin-b64/part-* | tr -d '\n' | base64 -d > HAPYCH-Admin-source.zip
          mkdir -p hapych-admin
          unzip -q HAPYCH-Admin-source.zip -d hapych-admin

          # v1.0.6: IP/domain + game port + RCON password; RCON port is auto-discovered.
          cat hapych-admin-overrides-v106-chunks/RconClient.part*.b64 | base64 -d | gzip -d > hapych-admin/app/src/main/java/com/hapych/admin/RconClient.kt
          cat hapych-admin-overrides-v106-chunks/MainActivity.part*.b64 | base64 -d | gzip -d > hapych-admin/app/src/main/java/com/hapych/admin/MainActivity.kt
          sed -i 's/rcon.close()/rcon.disconnect()/g' hapych-admin/app/src/main/java/com/hapych/admin/MainActivity.kt
          cp hapych-admin-overrides-v106/Models.kt hapych-admin/app/src/main/java/com/hapych/admin/Models.kt
          cp hapych-admin-overrides-v106/SecurePrefs.kt hapych-admin/app/src/main/java/com/hapych/admin/SecurePrefs.kt

          # v1.0.7: wire-level WebRCON auth detection and protocol confirmation.
          base64 -d hapych-admin-v107/rcon-v107.patch.gz.b64 | gzip -d > /tmp/rcon-v107.patch
          base64 -d hapych-admin-v107/main-v107.patch.gz.b64 | gzip -d > /tmp/main-v107.patch
          patch -d hapych-admin/app/src/main/java/com/hapych/admin -p1 < /tmp/rcon-v107.patch
          patch -d hapych-admin/app/src/main/java/com/hapych/admin -p1 < /tmp/main-v107.patch
          sed -i 's/SSLSocketFactory.getDefault().createSocket/(SSLSocketFactory.getDefault() as SSLSocketFactory).createSocket/' hapych-admin/app/src/main/java/com/hapych/admin/RconClient.kt

          # v1.0.8: stop endless TCP candidate scanning and accept successful WebRCON handshake as auth success.
          python3 - <<'PY'
          from pathlib import Path

          rcon = Path("hapych-admin/app/src/main/java/com/hapych/admin/RconClient.kt")
          s = rcon.read_text()

          # Replace the whole discovery tail of connect() without relying on exact whitespace.
          anchor = s.index('        append("RCON AUTO:')
          block_start = s.index("        scope.launch {", anchor)
          disconnect_start = s.index("    fun disconnect()", block_start)
          s = s[:block_start] + '''        scope.launch {
              // TCP-only scanning is misleading on some game hosts: edge proxies may accept many
              // neighbouring ports even though only one is Rust RCON. Probe the protocol directly.
              discoveryPorts = buildPortCandidates(gamePort)
              discoveryIndex = 0
              append(
                  "AUTO: проверяю типичные RCON-порты. Сначала ${discoveryPorts.take(5).joinToString(", ")}…",
                  LineKind.INFO
              )
              startCurrentCandidate(normalized, currentGeneration)
          }
          }

          ''' + s[disconnect_start:]

          # Bounded candidate list: +2 first for Alkad, then common host layouts.
          a = s.index("    private fun buildPortCandidates(gamePort: Int): List<Int> {")
          b = s.index("    private suspend fun scanOpenPorts", a)
          s = s[:a] + '''    private fun buildPortCandidates(gamePort: Int): List<Int> {
              val ports = LinkedHashSet<Int>()
              fun add(port: Int) { if (port in 1..65535) ports += port }

              listOf(2, 1, 3, 0, 4, -1).forEach { add(gamePort + it) }
              listOf(28016, 28017, 28018, 25575).forEach(::add)
              return ports.toList().take(10)
          }

          ''' + s[b:]

          # Give a real WebRCON handshake enough time on mobile networks.
          s = s.replace("soTimeout = 900", "soTimeout = 3_000", 1)
          s = s.replace("soTimeout = 1_500\n                    startHandshake()", "soTimeout = 3_500\n                    startHandshake()", 1)

          # In Rust WebRCON, HTTP 101 on /password means the password was accepted.
          # Do not wait for a second serverinfo proof during discovery.
          probe_start = s.index("            // A generic WebSocket service")
          probe_end = s.index("        } catch (e: java.net.ConnectException)", probe_start)
          s = s[:probe_start] + '            WebProbeResult(WebProbeKind.RCON_CONFIRMED, "WebSocket 101 / auth accepted")\n' + s[probe_end:]

          s = s.replace('HAPYCH-Admin/1.0.6', 'HAPYCH-Admin/1.0.8')
          s = s.replace('socket.connect(InetSocketAddress(settings.host, port), 4_500)', 'socket.connect(InetSocketAddress(settings.host, port), 1_500)')
          s = s.replace('val deadline = System.currentTimeMillis() + 4_500L', 'val deadline = System.currentTimeMillis() + 1_500L')
          s = s.replace('порт TCP открыт, но Source RCON auth не ответил за 4.5 секунды', 'порт TCP открыт, но Source RCON auth не ответил за 1.5 секунды')

          # Switching candidates must not create a new user connection generation.
          next_start = s.index("        if (discoveryIndex + 1 < discoveryPorts.size) {")
          next_end = s.index("        val tested = discoveryPorts.joinToString", next_start)
          s = s[:next_start] + '''        if (discoveryIndex + 1 < discoveryPorts.size) {
              discoveryIndex += 1
              val sameGeneration = generation
              val settings = discoverySettings ?: return fail("RCON AUTO: внутренняя ошибка настроек")
              closeTransports()
              fallbackStarted.set(false)
              webFailure = ""
              legacyFailure = ""
              _connection.value = ConnectionState.CONNECTING
              scope.launch {
                  delay(100)
                  if (sameGeneration == generation) startCurrentCandidate(settings, sameGeneration)
              }
              return
          }

          ''' + s[next_end:]
          rcon.write_text(s)

          main = Path("hapych-admin/app/src/main/java/com/hapych/admin/MainActivity.kt")
          m = main.read_text()
          m = m.replace(
              "Укажи IP и игровой порт — HAPYCH Admin проверит соседние TCP-порты и сам определит WebRCON/Legacy.",
              "Укажи IP и игровой порт — HAPYCH Admin быстро проверит типичные RCON-порты и остановится после ограниченного списка."
          )

          btn_start = m.index('            Button(\n                onClick = { onConnect(current()) },', m.index('Text("Сохранить"'))
          btn_end = m.index("        }\n        if (connection == ConnectionState.CONNECTED)", btn_start)
          new_btn = '''            Button(
              onClick = {
                  if (connection == ConnectionState.CONNECTING) onDisconnect() else onConnect(current())
              },
              modifier = Modifier.weight(1f),
              shape = RoundedCornerShape(14.dp),
              colors = ButtonDefaults.buttonColors(
                  containerColor = if (connection == ConnectionState.CONNECTING) Red else Orange,
                  contentColor = Color.Black
              )
          ) {
              Icon(if (connection == ConnectionState.CONNECTING) Icons.Rounded.Close else Icons.Rounded.PlayArrow, null)
              Spacer(Modifier.width(7.dp))
              Text(
                  when {
                      connection == ConnectionState.CONNECTING -> "Остановить"
                      demo -> "Demo"
                      else -> "Подключить"
                  },
                  fontWeight = FontWeight.Bold
              )
          }
          '''
          m = m[:btn_start] + new_btn + m[btn_end:]
          main.write_text(m)
          PY

          # v1.0.9: use the same OkHttp WebSocket engine for discovery and the live session.
          # This removes the custom raw HTTP/WebSocket preflight that timed out on the user's mobile route.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("hapych-admin/app/src/main/java/com/hapych/admin/RconClient.kt")
          s = p.read_text()

          start = s.index("    private fun startCurrentCandidate(settings: AppSettings, currentGeneration: Int) {")
          end = s.index("    private fun buildPortCandidates", start)
          s = s[:start] + '''    private fun startCurrentCandidate(settings: AppSettings, currentGeneration: Int) {
              if (currentGeneration != generation) return
              val port = discoveryPorts.getOrNull(discoveryIndex) ?: return fail("RCON AUTO: список портов пуст")
              currentCandidatePort = port
              fallbackStarted.set(false)
              webFailure = ""
              legacyFailure = ""
              val candidate = settings.copy(port = port.toString(), rconMode = RconMode.AUTO)
              append("AUTO: прямое WebRCON подключение к ${settings.host}:$port…", LineKind.INFO)

              // Use the final WebSocket client directly. Do not run a separate raw-socket preflight.
              startWebRcon(candidate, currentGeneration, allowFallback = true)
          }

          ''' + s[end:]

          s = s.replace("RCON-порт не подтверждён. Проверены TCP-порты:", "RCON-порт не подтверждён. Проверены RCON-кандидаты:")
          s = s.replace("HAPYCH-Admin/1.0.8", "HAPYCH-Admin/1.0.9")
          s = s.replace("delay(4_500)", "delay(7_000)")
          s = s.replace('val detail = "WebSocket handshake timeout"', 'val detail = "WebSocket не открылся за 7 секунд"')
          p.write_text(s)
          PY

          # v1.0.10: production/direct RCON connection. Exact IP/domain + exact RCON port + password.
          python3 - <<'PY'
          from pathlib import Path

          rcon = Path("hapych-admin/app/src/main/java/com/hapych/admin/RconClient.kt")
          s = rcon.read_text()

          a = s.index("    fun connect(settings: AppSettings) {")
          b = s.index("    fun disconnect()", a)
          direct_connect = """    fun connect(settings: AppSettings) {
              if (settings.demoMode) {
                  enableDemo()
                  return
              }

              val host = cleanHost(settings.host)
              val rconPort = settings.port.toIntOrNull()
              if (host.isBlank()) {
                  fail("Укажи IP-адрес или домен RCON")
                  return
              }
              if (rconPort == null || rconPort !in 1..65535) {
                  fail("RCON порт должен быть числом от 1 до 65535")
                  return
              }
              if (settings.password.isEmpty()) {
                  fail("Укажи RCON пароль")
                  return
              }

              generation += 1
              val currentGeneration = generation
              val normalized = settings.copy(host = host, port = rconPort.toString(), rconMode = RconMode.AUTO)
              lastSettings = normalized
              discoverySettings = normalized
              discoveryPorts = listOf(rconPort)
              discoveryIndex = 0
              currentCandidatePort = rconPort
              candidateFailures.clear()
              closeTransports()
              fallbackStarted.set(false)
              webFailure = ""
              legacyFailure = ""
              _detectedRconPort.value = null
              _detectedProtocol.value = ""
              _connection.value = ConnectionState.CONNECTING
              _lastError.value = ""

              append("RCON: подключение к $host:$rconPort…", LineKind.INFO)
              append("WebRCON: открываю " + (if (normalized.useTls) "wss" else "ws") + "://$host:$rconPort/<пароль>", LineKind.INFO)

              // Connect only to the exact endpoint supplied by the user.
              // AUTO here means protocol only: WebRCON first, then Legacy on the SAME port.
              startWebRcon(normalized, currentGeneration, allowFallback = true)
          }

          """
          s = s[:a] + direct_connect + s[b:]

          a = s.index("    private fun failCombined() {")
          b = s.index("    private fun startLegacyReader", a)
          direct_fail = """    private fun failCombined() {
              val settings = lastSettings
              val endpoint = settings?.let { it.host + ":" + it.port } ?: "указанный адрес"
              val web = webFailure.ifBlank { "соединение не установлено" }
              val legacy = legacyFailure.ifBlank { "авторизация не подтверждена" }
              val webLower = web.lowercase()
              val legacyLower = legacy.lowercase()

              val message = when {
                  "401" in webLower || "403" in webLower || "невер" in legacyLower ->
                      "RCON отклонил авторизацию на $endpoint. Проверь RCON пароль."
                  "refused" in webLower || "connectexception" in webLower ->
                      "RCON $endpoint недоступен: соединение отклонено. Проверь IP и RCON порт."
                  "timeout" in webLower || "timed out" in webLower ->
                      "RCON $endpoint не ответил вовремя. Проверь доступность RCON порта из мобильной сети."
                  else ->
                      "Не удалось подключиться к RCON $endpoint. WebRCON: $web. Legacy: $legacy"
              }
              fail(message)
          }

          """
          s = s[:a] + direct_fail + s[b:]

          s = s.replace("HAPYCH-Admin/1.0.9", "HAPYCH-Admin/1.0.10")
          s = s.replace("delay(7_000)", "delay(10_000)")
          s = s.replace("WebSocket не открылся за 7 секунд", "WebSocket не открылся за 10 секунд")
          rcon.write_text(s)

          main = Path("hapych-admin/app/src/main/java/com/hapych/admin/MainActivity.kt")
          m = main.read_text()
          m = m.replace('Text("Игровой порт", color = TextSecondary, fontSize = 11.sp)',
                        'Text("RCON порт", color = TextSecondary, fontSize = 11.sp)')
          m = m.replace('placeholder = { Text("Например 20530 или 28015") }',
                        'placeholder = { Text("Например 20532 или 28016") }')
          m = m.replace("RCON-порт найдётся автоматически", "Прямое RCON-подключение")
          m = m.replace(
              "Укажи IP и игровой порт — HAPYCH Admin быстро проверит типичные RCON-порты и остановится после ограниченного списка.",
              "Укажи точный IP/домен, RCON порт и пароль. Приложение подключается только к этому адресу — без перебора портов."
          )
          m = m.replace(
              "Укажи IP и игровой порт — HAPYCH Admin проверит соседние TCP-порты и сам определит WebRCON/Legacy.",
              "Укажи точный IP/домен, RCON порт и пароль. Приложение подключается только к этому адресу — без перебора портов."
          )
          m = m.replace("RCON найден автоматически", "RCON подключён")
          m = m.replace(
              "Для прямого подключения телефон должен видеть RCON-порт сервера. Безопаснее открывать его только через VPN/туннель или ограничить доступ по IP.",
              "Подключение идёт напрямую к указанному RCON IP:PORT. Если адрес, порт или пароль неверны — приложение покажет ошибку и не будет перебирать другие порты."
          )
          main.write_text(m)
          PY

          # v1.0.11: Rust 2026 WebRCON only. No Legacy/Source RCON and no port guessing.
          cat hapych-admin-v111/RconClient.part*.b64 | base64 -d | gzip -d > hapych-admin/app/src/main/java/com/hapych/admin/RconClient.kt

          python3 - <<'PY'
          from pathlib import Path

          # Reset the old saved TLS flag once by moving it to a new preference key.
          # Direct Rust WebRCON is WS by default; WSS is only for an explicit TLS proxy.
          prefs = Path("hapych-admin/app/src/main/java/com/hapych/admin/SecurePrefs.kt")
          p = prefs.read_text()
          p = p.replace('prefs.getString("game_port", "28015") ?: "28015"',
                        'prefs.getString("rcon_port", prefs.getString("game_port", "28016")) ?: "28016"')
          p = p.replace('prefs.getBoolean("tls", false)', 'prefs.getBoolean("tls_v111", false)')
          p = p.replace('.putString("game_port", settings.port.trim())',
                        '.putString("rcon_port", settings.port.trim())')
          p = p.replace('.putBoolean("tls", settings.useTls)',
                        '.putBoolean("tls_v111", settings.useTls)')
          prefs.write_text(p)

          main = Path("hapych-admin/app/src/main/java/com/hapych/admin/MainActivity.kt")
          m = main.read_text()
          m = m.replace("Прямое RCON-подключение", "Rust 2026 WebRCON")
          m = m.replace(
              "Укажи точный IP/домен, RCON порт и пароль. Приложение подключается только к этому адресу — без перебора портов.",
              "Укажи точный RCON IP/домен, RCON порт и пароль. Подключение идёт напрямую к современному Rust WebRCON — без Legacy и без перебора портов."
          )
          m = m.replace(
              "Включай только если RCON доступен через TLS/WSS-прокси",
              "Для обычного Rust WebRCON оставь выключенным. Включай только для отдельного TLS/WSS-прокси"
          )
          m = m.replace(
              "Подключение идёт напрямую к указанному RCON IP:PORT. Если адрес, порт или пароль неверны — приложение покажет ошибку и не будет перебирать другие порты.",
              "Rust 2026: только WebRCON (rcon.web 1). Если IP, RCON порт или пароль неверны — приложение сразу покажет ошибку. Legacy/Source RCON не используется."
          )
          m = m.replace('ScreenHeader("Консоль", "Rust WebRCON • live")',
                        'ScreenHeader("Консоль", "Rust 2026 WebRCON • live")')
          m = m.replace('ScreenHeader("Консоль", "Rust RCON • диагностика и команды")',
                        'ScreenHeader("Консоль", "Rust 2026 WebRCON • live")')
          main.write_text(m)
          PY

          # v1.0.12: production HAPYCH Relay transport.
          # Phone connects by WSS/443 to Render; relay connects to Rust 2026 WebRCON.
          python3 - <<'PY'
          from pathlib import Path

          rcon = Path("hapych-admin/app/src/main/java/com/hapych/admin/RconClient.kt")
          s = rcon.read_text()

          # UI-facing connect messages: exact Rust endpoint remains visible, transport is relay/WSS.
          s = s.replace(
              'val scheme = if (settings.useTls) "WSS/TLS" else "WS"\n        append("Rust 2026 WebRCON: подключение к $host:$port • $scheme", LineKind.INFO)\n        append("Используется только современный Rust WebRCON (rcon.web 1). Legacy/Source RCON отключён.", LineKind.INFO)',
              'append("HAPYCH Relay: защищённое подключение WSS/443", LineKind.INFO)\n        append("Rust 2026 WebRCON: целевой сервер $host:$port", LineKind.INFO)\n        append("Legacy/Source RCON не используется.", LineKind.INFO)'
          )

          # Replace the direct Rust socket handshake with a TLS WebSocket handshake to our relay.
          a = s.index("    private fun connectWebRcon(host: String, port: Int, password: String, useTls: Boolean, currentGeneration: Int) {")
          b = s.index("    private fun startReader(currentGeneration: Int) {", a)

          relay_connect = r'''    private fun connectWebRcon(host: String, port: Int, password: String, useTls: Boolean, currentGeneration: Int) {
              val relayHost = "hapych-rcon-relay.onrender.com"
              val relayPort = 443

              val raw = Socket()
              raw.tcpNoDelay = true
              raw.keepAlive = true
              raw.connect(InetSocketAddress(relayHost, relayPort), 8_000)
              raw.soTimeout = 75_000

              val connected = (SSLSocketFactory.getDefault() as SSLSocketFactory)
                  .createSocket(raw, relayHost, relayPort, true)
                  .let { it as SSLSocket }
                  .apply {
                      soTimeout = 75_000
                      startHandshake()
                  }

              if (currentGeneration != generation) {
                  runCatching { connected.close() }
                  return
              }

              val inputStream = BufferedInputStream(connected.getInputStream())
              val outputStream = BufferedOutputStream(connected.getOutputStream())
              val websocketKeyBytes = ByteArray(16).also(random::nextBytes)
              val websocketKey = Base64.getEncoder().encodeToString(websocketKeyBytes)

              val request = buildString {
                  append("GET /ws HTTP/1.1\r\n")
                  append("Host: ").append(relayHost).append("\r\n")
                  append("Upgrade: websocket\r\n")
                  append("Connection: Upgrade\r\n")
                  append("Sec-WebSocket-Key: ").append(websocketKey).append("\r\n")
                  append("Sec-WebSocket-Version: 13\r\n")
                  append("Authorization: Bearer ").append(password).append("\r\n")
                  append("Origin: https://").append(relayHost).append("\r\n")
                  append("User-Agent: HAPYCH-Admin/1.0.12\r\n")
                  append("\r\n")
              }

              outputStream.write(request.toByteArray(Charsets.ISO_8859_1))
              outputStream.flush()

              val first = inputStream.read()
              if (first < 0) throw EOFException("HAPYCH Relay закрыл соединение до WebSocket handshake")

              val header = readHttpHeader(inputStream, first)
              val firstLine = header.lineSequence().firstOrNull().orEmpty()
              if (!firstLine.contains(" 101 ")) {
                  when {
                      firstLine.contains(" 401 ") || firstLine.contains(" 403 ") -> throw AuthRejected()
                      firstLine.contains(" 429 ") -> throw HandshakeError("слишком много попыток подключения; повтори через минуту")
                      else -> throw HandshakeError(firstLine.ifBlank { "HAPYCH Relay не вернул HTTP 101" })
                  }
              }

              val accept = header.lineSequence()
                  .firstOrNull { it.startsWith("Sec-WebSocket-Accept:", ignoreCase = true) }
                  ?.substringAfter(':')?.trim().orEmpty()
              val expected = websocketAccept(websocketKey)
              if (accept.isNotBlank() && accept != expected) {
                  throw HandshakeError("неверный Sec-WebSocket-Accept от HAPYCH Relay")
              }

              connected.soTimeout = 1_000
              socket = connected
              input = inputStream
              output = outputStream
              _connection.value = ConnectionState.CONNECTED
              _lastError.value = ""
              _detectedRconPort.value = port
              _detectedProtocol.value = "Rust 2026 WebRCON • HAPYCH Relay • WSS"
              append("HAPYCH Relay подключён • WSS/443", LineKind.SUCCESS)
              append("Ожидаю подтверждение Rust WebRCON $host:$port…", LineKind.INFO)

              startReader(currentGeneration)
              requestRefresh()
              startAutoRefresh(currentGeneration)
          }

          '''
          s = s[:a] + relay_connect + s[b:]

          # Relay status/error messages are transport control messages, not Rust console text.
          handle_start = s.index("            val obj = root.asJsonObject", s.index("    private fun handleIncoming(raw: String)"))
          parse_pos = s.index("            parsePayload(message)", handle_start)
          parse_end = parse_pos + len("            parsePayload(message)")
          control_block = '''            val obj = root.asJsonObject
              val message = obj.get("Message")?.asString ?: raw
              val type = obj.get("Type")?.asString ?: ""

              if (type.equals("relay_status", ignoreCase = true)) {
                  _detectedProtocol.value = "Rust 2026 WebRCON • HAPYCH Relay • WSS"
                  append("HAPYCH Relay: $message", LineKind.SUCCESS)
                  return
              }
              if (type.equals("relay_error", ignoreCase = true)) {
                  connectionLost("HAPYCH Relay: $message")
                  return
              }

              parsePayload(message)'''
          s = s[:handle_start] + control_block + s[parse_end:]

          # Relay path is always TLS; direct WSS switch no longer affects transport.
          s = s.replace(
              'if (currentGeneration == generation) fail("RCON $host:$port отклонил пароль. Проверь RCON password.")',
              'if (currentGeneration == generation) fail("HAPYCH Relay отклонил авторизацию. Проверь RCON password.")'
          )
          s = s.replace(
              'if (currentGeneration == generation) fail("RCON $host:$port недоступен: соединение отклонено. Проверь IP и RCON порт.")',
              'if (currentGeneration == generation) fail("HAPYCH Relay недоступен. Проверь интернет на телефоне.")'
          )
          s = s.replace(
              'if (currentGeneration == generation) fail("RCON $host:$port не ответил вовремя. Проверь RCON порт и доступ к нему из мобильной сети.")',
              'if (currentGeneration == generation) fail("HAPYCH Relay не ответил вовремя. На бесплатном Render первый запуск может занять до минуты — повтори подключение.")'
          )
          s = s.replace(
