name: Build HAPYCH Admin APK

on:
  push:
    branches: [hapych-admin-app]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Restore HAPYCH Admin source
        shell: bash
        run: |
          cat hapych-admin-b64/part-* | tr -d '\n' | base64 -d > HAPYCH-Admin-source.zip
          mkdir -p hapych-admin
          unzip -q HAPYCH-Admin-source.zip -d hapych-admin

          # v1.0.6: IP/domain + game port + RCON password; RCON port is auto-discovered.
          cat hapych-admin-overrides-v106-chunks/RconClient.part*.b64 | base64 -d | gzip -d > hapych-admin/app/src/main/java/com/hapych/admin/RconClient.kt
          cat hapych-admin-overrides-v106-chunks/MainActivity.part*.b64 | base64 -d | gzip -d > hapych-admin/app/src/main/java/com/hapych/admin/MainActivity.kt
          sed -i 's/rcon.close()/rcon.disconnect()/g' hapych-admin/app/src/main/java/com/hapych/admin/MainActivity.kt
          cp hapych-admin-overrides-v106/Models.kt hapych-admin/app/src/main/java/com/hapych/admin/Models.kt
          cp hapych-admin-overrides-v106/SecurePrefs.kt hapych-admin/app/src/main/java/com/hapych/admin/SecurePrefs.kt

          # v1.0.7: wire-level WebRCON auth detection and protocol confirmation.
          base64 -d hapych-admin-v107/rcon-v107.patch.gz.b64 | gzip -d > /tmp/rcon-v107.patch
          base64 -d hapych-admin-v107/main-v107.patch.gz.b64 | gzip -d > /tmp/main-v107.patch
          patch -d hapych-admin/app/src/main/java/com/hapych/admin -p1 < /tmp/rcon-v107.patch
          patch -d hapych-admin/app/src/main/java/com/hapych/admin -p1 < /tmp/main-v107.patch
          sed -i 's/SSLSocketFactory.getDefault().createSocket/(SSLSocketFactory.getDefault() as SSLSocketFactory).createSocket/' hapych-admin/app/src/main/java/com/hapych/admin/RconClient.kt

          # v1.0.8: stop endless TCP candidate scanning and accept successful WebRCON handshake as auth success.
          python3 - <<'PY'
          from pathlib import Path

          rcon = Path("hapych-admin/app/src/main/java/com/hapych/admin/RconClient.kt")
          s = rcon.read_text()

          old = '''        scope.launch {
              val candidates = buildPortCandidates(gamePort)
              val openPorts = scanOpenPorts(host, candidates, currentGeneration)
              if (currentGeneration != generation) return@launch
              if (openPorts.isEmpty()) {
                  fail("RCON-порт автоматически не найден рядом с игровым портом $gamePort. Проверь IP/игровой порт и доступ к RCON извне.")
                  return@launch
              }
              discoveryPorts = openPorts
              discoveryIndex = 0
              append(
                  "AUTO: найдено TCP-кандидатов: ${openPorts.size}. Первые: ${openPorts.take(8).joinToString(", ")}${if (openPorts.size > 8) "…" else ""}. Определяю RCON…",
                  LineKind.INFO
              )
              startCurrentCandidate(normalized, currentGeneration)
          }
          '''
          new = '''        scope.launch {
              // TCP-only scanning is misleading on some game hosts: their edge proxy accepts many
              // neighbouring ports even though only one is Rust RCON. Probe RCON directly.
              discoveryPorts = buildPortCandidates(gamePort)
              discoveryIndex = 0
              append(
                  "AUTO: проверяю типичные RCON-порты. Сначала ${discoveryPorts.take(5).joinToString(", ")}…",
                  LineKind.INFO
              )
              startCurrentCandidate(normalized, currentGeneration)
          }
          '''
          if old not in s:
              raise SystemExit("v108 connect block not found")
          s = s.replace(old, new, 1)

          a = s.index("    private fun buildPortCandidates(gamePort: Int): List<Int> {")
          b = s.index("    private suspend fun scanOpenPorts", a)
          s = s[:a] + '''    private fun buildPortCandidates(gamePort: Int): List<Int> {
              val ports = LinkedHashSet<Int>()
              fun add(port: Int) { if (port in 1..65535) ports += port }

              // Fast deterministic order: Alkad commonly uses game+2.
              listOf(2, 1, 3, 0, 4, -1).forEach { add(gamePort + it) }
              listOf(28016, 28017, 28018, 25575).forEach(::add)
              return ports.toList().take(10)
          }

          ''' + s[b:]

          s = s.replace("soTimeout = 900", "soTimeout = 3_000", 1)
          s = s.replace("soTimeout = 1_500\n                    startHandshake()", "soTimeout = 3_500\n                    startHandshake()", 1)

          marker = '''            // A generic WebSocket service (for example a companion endpoint) can also return 101.
              // Confirm that it actually understands the Rust WebRCON JSON protocol.
          '''
          start = s.index(marker)
          end = s.index("        } catch (e: java.net.ConnectException)", start)
          s = s[:start] + '            WebProbeResult(WebProbeKind.RCON_CONFIRMED, "WebSocket 101 / auth accepted")\n' + s[end:]

          s = s.replace('HAPYCH-Admin/1.0.6', 'HAPYCH-Admin/1.0.8')
          s = s.replace('socket.connect(InetSocketAddress(settings.host, port), 4_500)', 'socket.connect(InetSocketAddress(settings.host, port), 1_500)')
          s = s.replace('val deadline = System.currentTimeMillis() + 4_500L', 'val deadline = System.currentTimeMillis() + 1_500L')
          s = s.replace('порт TCP открыт, но Source RCON auth не ответил за 4.5 секунды', 'порт TCP открыт, но Source RCON auth не ответил за 1.5 секунды')

          old_next = '''        if (discoveryIndex + 1 < discoveryPorts.size) {
              discoveryIndex += 1
              generation += 1
              val nextGeneration = generation
              val settings = discoverySettings ?: return fail("RCON AUTO: внутренняя ошибка настроек")
              closeTransports()
              fallbackStarted.set(false)
              webFailure = ""
              legacyFailure = ""
              _connection.value = ConnectionState.CONNECTING
              scope.launch {
                  delay(120)
                  if (nextGeneration == generation) startCurrentCandidate(settings, nextGeneration)
              }
              return
          }
          '''
          new_next = '''        if (discoveryIndex + 1 < discoveryPorts.size) {
              discoveryIndex += 1
              val sameGeneration = generation
              val settings = discoverySettings ?: return fail("RCON AUTO: внутренняя ошибка настроек")
              closeTransports()
              fallbackStarted.set(false)
              webFailure = ""
              legacyFailure = ""
              _connection.value = ConnectionState.CONNECTING
              scope.launch {
                  delay(100)
                  if (sameGeneration == generation) startCurrentCandidate(settings, sameGeneration)
              }
              return
          }
          '''
          if old_next not in s:
              raise SystemExit("v108 next-candidate block not found")
          s = s.replace(old_next, new_next, 1)
          rcon.write_text(s)

          main = Path("hapych-admin/app/src/main/java/com/hapych/admin/MainActivity.kt")
          m = main.read_text()
          m = m.replace(
              "Укажи IP и игровой порт — HAPYCH Admin проверит соседние TCP-порты и сам определит WebRCON/Legacy.",
              "Укажи IP и игровой порт — HAPYCH Admin быстро проверит типичные RCON-порты и остановится после ограниченного списка."
          )
          old_button = '''            Button(
                  onClick = { onConnect(current()) },
                  modifier = Modifier.weight(1f),
                  shape = RoundedCornerShape(14.dp),
                  colors = ButtonDefaults.buttonColors(containerColor = Orange, contentColor = Color.Black)
              ) {
                  Icon(Icons.Rounded.PlayArrow, null)
                  Spacer(Modifier.width(7.dp))
                  Text(if (demo) "Demo" else "Подключить", fontWeight = FontWeight.Bold)
              }
          '''
          new_button = '''            Button(
                  onClick = {
                      if (connection == ConnectionState.CONNECTING) onDisconnect() else onConnect(current())
                  },
                  modifier = Modifier.weight(1f),
                  shape = RoundedCornerShape(14.dp),
                  colors = ButtonDefaults.buttonColors(
                      containerColor = if (connection == ConnectionState.CONNECTING) Red else Orange,
                      contentColor = Color.Black
                  )
              ) {
                  Icon(if (connection == ConnectionState.CONNECTING) Icons.Rounded.Close else Icons.Rounded.PlayArrow, null)
                  Spacer(Modifier.width(7.dp))
                  Text(
                      when {
                          connection == ConnectionState.CONNECTING -> "Остановить"
                          demo -> "Demo"
                          else -> "Подключить"
                      },
                      fontWeight = FontWeight.Bold
                  )
              }
          '''
          if old_button not in m:
              raise SystemExit("v108 button block not found")
          m = m.replace(old_button, new_button, 1)
          main.write_text(m)
          PY

          sed -i 's/applicationId = "com.hapych.admin"/applicationId = "ru.hapychrust.admin"/' hapych-admin/app/build.gradle.kts
          sed -i 's/android:name=".MainActivity"/android:name="com.hapych.admin.MainActivity"/' hapych-admin/app/src/main/AndroidManifest.xml
          sed -i 's/versionCode = 1/versionCode = 8/' hapych-admin/app/build.gradle.kts
          sed -i 's/versionName = "1.0.0"/versionName = "1.0.8"/' hapych-admin/app/build.gradle.kts

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: hapych-admin
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK signature and manifest
        shell: bash
        run: |
          APK="hapych-admin/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -20
          cp "$APK" HAPYCH-Admin-v1.0.8-RCON-STABLE.apk
          sha256sum HAPYCH-Admin-v1.0.8-RCON-STABLE.apk > HAPYCH-Admin-v1.0.8-RCON-STABLE.apk.sha256

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: HAPYCH-Admin-v1.0.8-RCON-STABLE
          path: |
            HAPYCH-Admin-v1.0.8-RCON-STABLE.apk
            HAPYCH-Admin-v1.0.8-RCON-STABLE.apk.sha256
          if-no-files-found: error
