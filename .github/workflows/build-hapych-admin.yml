          PY

          sed -i 's/applicationId = "com.hapych.admin"/applicationId = "ru.hapychrust.admin"/' hapych-admin/app/build.gradle.kts
          sed -i 's/android:name=".MainActivity"/android:name="com.hapych.admin.MainActivity"/' hapych-admin/app/src/main/AndroidManifest.xml
          sed -i 's/versionCode = 1/versionCode = 18/' hapych-admin/app/build.gradle.kts
          sed -i 's/versionName = "1.0.0"/versionName = "1.0.18"/' hapych-admin/app/build.gradle.kts

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: hapych-admin
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK signature and manifest
        shell: bash
        run: |
          APK="hapych-admin/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -20
          cp "$APK" HAPYCH-Admin-v1.0.18-PLAYER-CONTROL.apk
          sha256sum HAPYCH-Admin-v1.0.18-PLAYER-CONTROL.apk > HAPYCH-Admin-v1.0.18-PLAYER-CONTROL.apk.sha256

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: HAPYCH-Admin-v1.0.18-PLAYER-CONTROL
          path: |
            HAPYCH-Admin-v1.0.18-PLAYER-CONTROL.apk
            HAPYCH-Admin-v1.0.18-PLAYER-CONTROL.apk.sha256
          if-no-files-found: error
