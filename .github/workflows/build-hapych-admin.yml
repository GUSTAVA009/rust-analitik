          @Composable
          private fun PlayersScreen(players: List<RustPlayer>, onRefresh: () -> Unit, onCommand: (String) -> Unit) {
              var query by remember { mutableStateOf("") }
              var selectedPlayer by remember { mutableStateOf<RustPlayer?>(null) }
              var givePlayer by remember { mutableStateOf<RustPlayer?>(null) }
              var pendingAction by remember { mutableStateOf<Pair<RustPlayer, String>?>(null) }

              BackHandler(enabled = selectedPlayer != null || givePlayer != null) {
                  if (givePlayer != null) givePlayer = null else selectedPlayer = null
              }

              givePlayer?.let { player ->
                  PlayerGiveItemScreen(
                      player = player,
                      onBack = { givePlayer = null },
                      onGive = { shortName, amount ->
                          onCommand("inventory.giveto ${player.steamId} $shortName $amount")
                          givePlayer = null
                      }
                  )
                  return
              }

              selectedPlayer?.let { player ->
                  PlayerDetailScreen(
                      player = player,
                      onBack = { selectedPlayer = null },
                      onGiveItem = { givePlayer = player },
                      onKick = { pendingAction = player to "kick" },
                      onBan = { pendingAction = player to "ban" }
                  )
              } ?: run {
                  val filtered = remember(players, query) {
                      if (query.isBlank()) players
                      else players.filter { it.name.contains(query, true) || it.steamId.contains(query) }
                  }

                  Column(Modifier.fillMaxSize()) {
                      ScreenHeader("Игроки", "${players.size} подключено") {
                          IconButton(onClick = onRefresh) { Icon(Icons.Rounded.Refresh, null, tint = Orange) }
                      }
                      OutlinedTextField(
                          value = query,
                          onValueChange = { query = it },
                          modifier = Modifier.fillMaxWidth().padding(horizontal = 18.dp),
                          placeholder = { Text("Ник или SteamID", color = TextSecondary) },
                          leadingIcon = { Icon(Icons.Rounded.Search, null, tint = TextSecondary) },
                          singleLine = true,
                          shape = RoundedCornerShape(16.dp),
                          colors = hapychTextFieldColors()
                      )
                      Spacer(Modifier.height(10.dp))
                      LazyColumn(
                          contentPadding = PaddingValues(horizontal = 18.dp, vertical = 6.dp),
                          verticalArrangement = Arrangement.spacedBy(9.dp)
                      ) {
                          items(filtered, key = { it.steamId }) { player ->
                              PlayerCard(player, onClick = { selectedPlayer = player })
                          }
                          if (filtered.isEmpty()) {
                              item { EmptyState("👥", "Игроки не найдены", "Обнови список или измени запрос") }
                          }
                      }
                  }
              }

              pendingAction?.let { (player, action) ->
                  val ban = action == "ban"
                  AlertDialog(
                      onDismissRequest = { pendingAction = null },
                      containerColor = Panel2,
                      title = { Text(if (ban) "Забанить игрока?" else "Кикнуть игрока?", color = TextPrimary) },
                      text = { Text("${player.name}\n${player.steamId}", color = TextSecondary) },
                      confirmButton = {
                          Button(
                              onClick = {
                                  if (ban) onCommand("banid ${player.steamId} \"Banned from HAPYCH Admin\"")
                                  else onCommand("kick ${player.steamId} \"Kicked from HAPYCH Admin\"")
                                  pendingAction = null
                                  selectedPlayer = null
                              },
                              colors = ButtonDefaults.buttonColors(containerColor = if (ban) Red else Orange, contentColor = Color.Black)
                          ) { Text(if (ban) "BAN" else "KICK", fontWeight = FontWeight.Black) }
                      },
                      dismissButton = { TextButton(onClick = { pendingAction = null }) { Text("Отмена", color = TextSecondary) } }
                  )
              }
          }

